# Reverse proxy in front of FreeLLMAPI.
# Served by the `nginx` container in compose; no host nginx install required.
#
# - Forwards /v1 and /api to the freellmapi container (port 3001).
# - Serves the dashboard at / on the same host/port as the API.
# - Optional HTTP Basic Auth (ENABLE_NGINX_AUTH=1) guards the whole thing.
# - Lets long-lived SSE / streaming connections through.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Streaming: don't buffer server-sent events or chunked responses.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Basic auth realm + htpasswd file (only used when ENABLE_NGINX_AUTH=1).
    auth_basic "Freellmapi";
    auth_basic_user_file /etc/nginx/.htpasswd;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Skip auth for the health check.
        location = /healthz {
            auth_basic off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        # Everything else: auth if enabled, then proxy.
        location / {
            auth_basic $nginx_auth_enabled;
            proxy_pass http://freellmapi:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}